<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="page_admin_title">Cleverdi — Администратору</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="nav">
        <a class="brand" href="index.html">
          <img src="assets/img/logo.svg" alt="Cleverdi"/>
          <span>Cleverdi</span>
        </a>

        <nav class="navlinks" aria-label="Main navigation">
          <a href="index.html" data-i18n="nav_home"></a>
          <a href="courses.html" data-i18n="nav_courses"></a>
          <a href="materials.html" data-i18n="nav_materials"></a>
          <a href="schedule.html" data-i18n="nav_schedule"></a>
          <a href="certificates.html" data-i18n="nav_certs"></a>
          <a href="students-info.html" data-i18n="nav_students_info"></a>
          <a href="contacts.html" data-i18n="nav_contacts"></a>
        </nav>

        <div class="actions">
          <div class="lang" role="group" aria-label="Language switcher">
            <button type="button" data-lang="ru">RU</button>
            <button type="button" data-lang="kg">KG</button>
          </div>
          <button class="burger" type="button" data-burger aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" stroke="#101828" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="mobilemenu" data-mobilemenu>
        <a href="index.html" data-i18n="nav_home"></a>
        <a href="courses.html" data-i18n="nav_courses"></a>
        <a href="materials.html" data-i18n="nav_materials"></a>
        <a href="schedule.html" data-i18n="nav_schedule"></a>
        <a href="certificates.html" data-i18n="nav_certs"></a>
        <a href="students-info.html" data-i18n="nav_students_info"></a>
        <a href="contacts.html" data-i18n="nav_contacts"></a>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="hero-card" style="padding: 26px 22px;">
      <div class="kicker" data-i18n="admin_kicker"></div>
      <h1 class="h2" style="margin:10px 0 8px;" data-i18n="admin_h1"></h1>
      <p class="muted" style="margin:0 0 16px; max-width: 78ch;" data-i18n="admin_lead"></p>

      <div class="grid-2" style="gap:14px;">
        <div class="card" style="padding:16px;">
          <h3 style="margin:0 0 10px;" data-i18n="admin_links_title"></h3>
          <p class="muted" style="margin:0 0 14px;" data-i18n="admin_links_text"></p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn primary" id="btnOpenSheet" href="#" target="_blank" rel="noopener" data-i18n="admin_open_sheet"></a>
            <a class="btn" id="btnOpenForm" href="#" target="_blank" rel="noopener" data-i18n="admin_open_form"></a>
          </div>
          <div class="notice" style="margin-top:12px;" data-i18n="admin_hint"></div>
        </div>

        <div class="card" style="padding:16px;">
          <h3 style="margin:0 0 10px;" data-i18n="admin_student_link_title"></h3>
          <p class="muted" style="margin:0 0 14px;" data-i18n="admin_student_link_text"></p>

          <form id="linkGen" class="form-grid" style="grid-template-columns: 1fr 1fr auto;">
            <div class="form-field">
              <label class="label" for="gSid" data-i18n="students_id_label"></label>
              <input class="input" id="gSid" placeholder="CLV-1021" required />
            </div>
            <div class="form-field">
              <label class="label" for="gCode" data-i18n="students_code_label"></label>
              <input class="input" id="gCode" placeholder="4521" required />
            </div>
            <div class="form-field" style="align-self:end;">
              <button class="btn primary" type="submit" data-i18n="admin_generate"></button>
            </div>
          </form>

          <div class="card" style="padding:12px; margin-top:12px; background: rgba(255,255,255,.8)">
            <div class="muted" style="font-size:13px; font-weight:800;" data-i18n="admin_result_label"></div>
            <div id="genOut" style="margin-top:8px; font-weight:800; overflow-wrap:anywhere;"></div>
            <button class="btn" id="btnCopy" type="button" style="margin-top:10px;" data-i18n="admin_copy"></button>
          </div>
        </div>
      </div>

      <div class="card" style="padding:16px; margin-top:14px;">
        <h3 style="margin:0 0 10px;" data-i18n="admin_columns_title"></h3>
        <div class="notice" data-i18n="admin_columns_text"></div>
        <div class="codeblock" style="margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:14px; background:#fff; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;">
id, code, full_name, course, group, status, start_date, schedule, materials, links, notes
        </div>
        <div class="muted" style="margin-top:10px;" data-i18n="admin_links_format"></div>
      </div>

      <div class="card" style="padding:16px; margin-top:14px;">
        <h3 style="margin:0 0 10px;" data-i18n="admin_embed_title"></h3>
        <p class="muted" style="margin:0 0 12px;" data-i18n="admin_embed_text"></p>
        <div class="notice" data-i18n="admin_embed_note"></div>
        <div style="margin-top:12px;">
          <iframe id="adminEmbed" title="Google Form" style="width:100%; height:560px; border:1px solid var(--line); border-radius:16px; background:#fff;" src=""></iframe>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <div class="brand">
          <span class="logo-dot"></span>
          <span class="brand-name">Cleverdi Academy</span>
        </div>
        <div class="muted" style="margin-top:8px;" data-i18n="footer_copy"></div>
      </div>
      <div class="muted footer-right" data-i18n="footer_right"></div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/nav-active.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
